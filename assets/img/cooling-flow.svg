fill="#2c2a55" font-weight="400" text-anchor="start">   (임계값 0.34)</text><text x="650" y="162" font-size="11.5" fill="#2c2a55" font-weight="400" text-anchor="start">② 고장 유형 분류</text><path d="M776 135 l12 0" stroke="#3F3B93" stroke-width="2"/><path d="M784 130 l6 5 -6 5" fill="none" stroke="#3F3B93" stroke-width="2"/><rect x="790" y="60" width="136" height="150" rx="14" fill="#E6E3FA"/><circle cx="810" cy="82" r="11" fill="#3F3B93"/><text x="810" y="87" font-size="12" fill="#fff" font-weight="800" text-anchor="middle">6</text><text x="828" y="87" font-size="14" fill="#2A2870" font-weight="800" text-anchor="start">경보 처리</text><text x="802" y="118" font-size="11.5" fill="#2c2a55" font-weight="400" text-anchor="start">연속 경보 병합</text><text x="802" y="140" font-size="11.5" fill="#2c2a55" font-weight="400" text-anchor="start">Cooldown 적용</text><path d="M928 135 l12 0" stroke="#3F3B93" stroke-width="2"/><path d="M936 130 l6 5 -6 5" fill="none" stroke="#3F3B93" stroke-width="2"/><rect x="942" y="60" width="136" height="150" rx="14" fill="#3F3B93"/><circle cx="962" cy="82" r="11" fill="#fff"/><text x="962" y="87" font-size="12" fill="#3F3B93" font-weight="800" text-anchor="middle">7</text><text x="980" y="87" font-size="14" fill="#fff" font-weight="800" text-anchor="start">대시보드</text><text x="954" y="118" font-size="11.5" fill="#fff" font-weight="400" text-anchor="start">20개 설비 위험도</text><text x="954" y="140" font-size="11.5" fill="#fff" font-weight="400" text-anchor="start">우선 점검</text><text x="954" y="162" font-size="11.5" fill="#fff" font-weight="400" text-anchor="start">상세진단, 조치 기록</text><rect x="30" y="232" width="1170" height="62" rx="10" fill="#fff" stroke="#E4E0F3"/><text x="48" y="258" font-size="13" fill="#2A2870" font-weight="800" text-anchor="start">검증 장치</text><text x="48" y="280" font-size="12" fill="#5B5873" font-weight="400" text-anchor="start">모델 1은 85개, 모델 2는 72개 feature를 사용하므로 개수, 이름, 순서를 대시보드 입력 단계에서 검사하고 회귀 테스트 10개를 통과시켰습니다.</text></svg>