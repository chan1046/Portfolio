<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 320" width="1230" height="320" role="img" aria-label="냉각 설비 예지보전 데이터 파이프라인 흐름도" font-family="Noto Sans KR,Pretendard,Malgun Gothic,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1230" height="320" fill="#fff"/><text x="40" y="34" font-size="20" fill="#2A2870" font-weight="800" text-anchor="start">데이터에서 대시보드까지</text><rect x="30" y="60" width="136" height="150" rx="14" fill="#E6E3FA"/><circle cx="50" cy="82" r="11" fill="#3F3B93"/><text x="50" y="87" font-size="12" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="68" y="87" font-size="14" fill="#2A2870" font-weight="800" text-anchor="start">센서 원본</text><text x="42" y="118" font-size="11.5" fill="#2c2a55" font-weight="400" text-anchor="start">20개 설비</text><text x="42" y="140" font-size="11.5" fill="#2c2a55" font-weight="400" text-anchor="start">82,189,440행</text><text x="42" y="162" font-size="11.5" fill="#2c2a55" font-weight="400" text-anchor="start">(4초 간격)</text><path d="M168 135 l12 0" stroke="#3F3B93" stroke-width="2"/><path d="M176 130 l6 5 -6 5" fill="none" stroke="#3F3B93" stroke-width="2"/><rect x="182" y="60" width="136" height="150" rx="14" fill="#E6E3FA"/><circle cx="202" cy="82" r="11" fill="#3F3B93"/><text x="202" y="87" font-size="12" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="220" y="87" font-size="14" fill="#2A2870" font-weight="800" text-anchor="start">전처리</text><text x="194" y="118" font-size="11.5" fill="#2c2a55" font-weight="400" text-anchor="start">10만 행 청크 처리</text><text x="194" y="140" font-size="11.5" fill="#2c2a55" font-weight="400" text-anchor="start">1분 단위 집계</text><text x="194" y="162" font-size="11.5" fill="#2c2a55" font-weight="400" text-anchor="start">시각 정합성 검증</text><path d="M320 135 l12 0" stroke="#3F3B93" stroke-width="2"/><path d="M328 130 l6 5 -6 5" fill="none" stroke="#3F3B93" stroke-width="2"/><rect x="334" y="60"