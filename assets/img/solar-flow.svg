<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<title>요청 흐름: 사업주 신청, 관리자 승인과 처리, 결과 확인</title>
<desc>사업주가 직접 신청하거나 기준 아래 자동 요청이 만들어지면, 관리자(설비관리자)가 근거를 만들고 승인 또는 반려하고, 승인한 건을 관리자가 처리해 완료하며, 사업주가 결과를 확인한다. 상태가 바뀔 때마다 기록이 남는다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="540" fill="#FFFFFF"/>

<rect x="40" y="20" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="104" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">직접 신청</text>
<text x="104" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">사업주</text>

<rect x="196" y="20" width="128" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="260" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">자동 요청</text>
<text x="260" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">기준 아래일 때</text>

<line x1="104" y1="76" x2="104" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M260 76 L260 98 L136 98 L136 118" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="120" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="104" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">신청</text>
<text x="104" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">사업주</text>

<rect x="196" y="120" width="128" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="260" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">근거 만들기</text>
<text x="260" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">관리자</text>

<rect x="352" y="120" width="128" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="416" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">승인</text>
<text x="416" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">관리자</text>

<rect x="508" y="120" width="128" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="572" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">처리 중</text>
<text x="572" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">관리자</text>

<line x1="168" y1="148" x2="194" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="324" y1="148" x2="350" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="148" x2="506" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="352" y="236" width="128" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="416" y="254" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">반려</text>
<text x="416" y="274" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">사유 필수</text>
<line x1="416" y1="176" x2="416" y2="234" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="508" y="236" width="128" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="572" y="254" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">완료</text>
<text x="572" y="274" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">관리자, 결과 입력</text>
<line x1="572" y1="176" x2="572" y2="234" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="508" y="326" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="572" y="344" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">결과 확인</text>
<text x="572" y="364" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">사업주</text>
<line x1="572" y1="292" x2="572" y2="324" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="416" width="596" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="338" y="436" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441">기록: 상태가 바뀔 때마다 자동으로 한 줄, 고치거나 지울 수 없음</text>

<rect x="40" y="478" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="58" y="485" dominant-baseline="central" font-size="12" fill="#2C2C2A">사업주(요청자)</text>
<rect x="40" y="498" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="58" y="505" dominant-baseline="central" font-size="12" fill="#2C2C2A">관리자(설비관리자): 근거 확인, 승인·반려, 현장 처리, 결과 입력, 관리자 페이지</text>
</svg>
